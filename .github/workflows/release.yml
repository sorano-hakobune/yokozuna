name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"

          - platform: "ubuntu-22.04"
            args: ""

          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm" # pnpm / yarn の場合は変更

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS のときだけ必要なターゲットを追加
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci # pnpm / yarn の場合は変更

      # ---------- ここから version を自動取得 ----------
      - name: Get version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }} # tauri.conf.json の version を使用
          releaseName: "yokozuna v${{ steps.version.outputs.version }}"
          releaseBody: |
            ## yokozuna v${{ steps.version.outputs.version }}

            ### ダウンロード
            各プラットフォームのインストーラーを Assets からダウンロードしてください。

            - **Windows**: `.msi` または `.exe`
            - **macOS**: `.dmg`
            - **Linux**: `.deb` または `.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
