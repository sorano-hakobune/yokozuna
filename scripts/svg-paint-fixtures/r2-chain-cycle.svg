<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="base">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#222222"/>
    </linearGradient>
    <linearGradient id="mid" href="#base"/>
    <linearGradient id="top" xlink:href="#mid" x1="0" y1="0" x2="1" y2="1"/>
    <linearGradient id="self" href="#self"/>
    <linearGradient id="cycA" href="#cycB"/>
    <linearGradient id="cycB" href="#cycA"/>
  </defs>
  <rect x="0" y="0" width="10" height="10" fill="url(#top)"/>
  <rect x="20" y="0" width="10" height="10" fill="url(#self)"/>
  <rect x="40" y="0" width="10" height="10" fill="url(#cycA)"/>
</svg>
